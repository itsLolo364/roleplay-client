plugins {
    id 'fabric-loom' version '1.17.17'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Better Tab (tab.bettertab.tabList.TabEntry) per l'integrazione del badge "i" nella tab.
    modImplementation files("libs/bettertab.jar")

    // Crafty.gg serve WebP: decoder ImageIO bundled nel JAR (jar-in-jar)
    include(implementation("com.twelvemonkeys.imageio:imageio-webp:3.12.0"))
    include(implementation("com.twelvemonkeys.imageio:imageio-core:3.12.0"))
    include(implementation("com.twelvemonkeys.common:common-lang:3.12.0"))
    include(implementation("com.twelvemonkeys.common:common-io:3.12.0"))
    include(implementation("com.twelvemonkeys.common:common-image:3.12.0"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
